<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste API TOA-TOA</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; line-height: 1.6; }
        form { background: #f4f4f4; padding: 20px; border-radius: 8px; display: grid; gap: 10px; }
        input, textarea, button { padding: 8px; width: 100%; box-sizing: border-box; }
        button { cursor: pointer; background: #28a745; color: white; border: none; font-weight: bold; }
        button:hover { background: #218838; }
        .config { border-bottom: 2px solid #ddd; margin-bottom: 20px; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Painel de Teste - TOA-TOA</h1>

    <div class="config">
        <label>Chave API (CHAVE_MESTRA):</label>
        <input type="password" id="apiKey" placeholder="Insira a sua chave de comunicação">
    </div>

    <h2>Novo Produto</h2>
    <form id="produtoForm">
        <input type="hidden" id="produtoId"> <!-- Campo oculto para ID na edição -->
        <input type="text" id="nomeProduto" placeholder="Nome do Produto" required>
        <input type="text" id="categoria" placeholder="Categoria">
        <input type="date" id="validade">
        <input type="number" id="quantidade" placeholder="Quantidade" value="1">
        <input type="number" step="0.01" id="precoUnitario" placeholder="Preço Unitário">
        <input type="number" step="0.01" id="precoPacote" placeholder="Preço Pacote">
        <textarea id="descricao" placeholder="Descrição"></textarea>
        <button type="submit">Salvar Produto</button>
    </form>

    <h2>Lista de Produtos</h2>
    <button onclick="carregarProdutos()" style="background: #007bff; width: auto;">Atualizar Lista</button>
    <table id="produtosTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Qtd</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const form = document.getElementById('produtoForm');
        const apiKeyInput = document.getElementById('apiKey');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('produtoId').value;
            
            const data = {
                nomeProduto: document.getElementById('nomeProduto').value,
                categoria: document.getElementById('categoria').value,
                validade: document.getElementById('validade').value,
                quantidade: document.getElementById('quantidade').value,
                precoUnitario: document.getElementById('precoUnitario').value,
                precoPacote: document.getElementById('precoPacote').value,
                descricao: document.getElementById('descricao').value,
                imagem: 'placeholder.jpg'
            };

            const url = id ? `/toa-toa-api-supabase/${id}` : '/toa-toa-api-supabase';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKeyInput.value
                    },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.mensagem || result.status);
                if (res.ok) {
                    form.reset();
                    document.getElementById('produtoId').value = '';
                    carregarProdutos();
                }
            } catch (err) {
                alert('Erro ao salvar: ' + err.message);
            }
        });

        async function carregarProdutos() {
            const tbody = document.querySelector('#produtosTable tbody');
            tbody.innerHTML = '<tr><td colspan="4">Carregando...</td></tr>';
            
            try {
                const res = await fetch('/toa-toa-api-supabase', {
                    headers: { 'x-api-key': apiKeyInput.value }
                });
                const result = await res.json();
                
                if (result.status === "sucesso") {
                    tbody.innerHTML = '';
                    result.dados.forEach(p => { // Adiciona um evento de clique para buscar detalhes
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${p.id}</td>
                            <td>${p.nome}</td>
                            <td>R$ ${p.preco_unitario}</td>
                            <td>${p.quantidade}</td>
                            <td>
                                <button onclick="event.stopPropagation(); prepararEdicao(${p.id})" style="background:#ffc107; width:auto; color:black; padding:2px 5px;">Editar</button>
                                <button onclick="event.stopPropagation(); deletarProduto(${p.id})" style="background:#dc3545; width:auto; padding:2px 5px;">Excluir</button>
                            </td>
                        `;
                        tr.style.cursor = "pointer";
                        tr.onclick = () => mostrarDetalhesProduto(p.id);
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4">Erro: ${result.mensagem}</td></tr>`;
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4">Erro de conexão</td></tr>`;
            }
        }

        async function deletarProduto(id) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) return;
            
            try {
                const res = await fetch(`/toa-toa-api-supabase/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-api-key': apiKeyInput.value }
                });
                const result = await res.json();
                alert(result.mensagem);
                carregarProdutos();
            } catch (err) {
                alert('Erro ao excluir: ' + err.message);
            }
        }

        async function prepararEdicao(id) {
            try {
                const res = await fetch(`/toa-toa-api-supabase/${id}`, {
                    headers: { 'x-api-key': apiKeyInput.value }
                });
                const result = await res.json();
                
                if (result.status === "sucesso") {
                    const p = result.dados;
                    document.getElementById('produtoId').value = p.id;
                    document.getElementById('nomeProduto').value = p.nome;
                    document.getElementById('categoria').value = p.categoria || '';
                    document.getElementById('validade').value = p.validade || '';
                    document.getElementById('quantidade').value = p.quantidade;
                    document.getElementById('precoUnitario').value = p.preco_unitario;
                    document.getElementById('precoPacote').value = p.preco_pacote;
                    document.getElementById('descricao').value = p.descricao || '';
                    
                    window.scrollTo(0, 0);
                    document.querySelector('h2').innerText = "Editando Produto #" + p.id;
                }
            } catch (err) {
                alert('Erro ao carregar dados para edição.');
            }
        }

        async function mostrarDetalhesProduto(id) {
            try {
                const res = await fetch(`/toa-toa-api-supabase/${id}`, {
                    headers: { 'x-api-key': apiKeyInput.value }
                });
                const result = await res.json();

                if (result.status === "sucesso") {
                    const p = result.dados;
                    alert(`Detalhes do Produto:\n` +
                          `ID: ${p.id}\n` +
                          `Nome: ${p.nome}\n` +
                          `Categoria: ${p.categoria || 'N/A'}\n` +
                          `Validade: ${p.validade || 'N/A'}\n` +
                          `Quantidade: ${p.quantidade}\n` +
                          `Preço Unitário: R$ ${p.preco_unitario}\n` +
                          `Preço Pacote: R$ ${p.preco_pacote}\n` +
                          `Descrição: ${p.descricao || 'N/A'}\n` +
                          `Imagem: ${p.imagem || 'N/A'}`);
                } else {
                    alert(`Erro ao buscar detalhes: ${result.mensagem}`);
                }
            } catch (err) {
                alert('Erro de conexão ao buscar detalhes: ' + err.message);
            }
        }
    </script>
</body>
</html>
