services:
  - type: web
    name: toa-toa-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CHAVE_MESTRA
        sync: false
      - key: SUPABASE_BUCKET
        value: toa-toa-moda-festa
      - key: CORS_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
    healthCheckPath: /health
    rootDirectory: .
